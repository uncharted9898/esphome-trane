  # The 2026-09-23/24 idle archives captured 21 stator-heat cycles with the
  # compressor fixed at 0 RPS. These three adjacent channels switch from zero
  # to a three-phase current pattern during stator heat and were previously
  # balanced together during active compressor operation. Keep phase numbering
  # generic until OEM U/V/W ordering is independently established.
  - platform: template
    id: trane_388_float1
    name: "0x388 Compressor Phase Current 1 Candidate"
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
