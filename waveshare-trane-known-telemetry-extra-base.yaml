  # This stays above the commanded 0x280 speed at low/moderate/high load
  # (~40 vs 29, ~63 vs 56, ~66-68 vs ~58 RPS) and falls to zero when idle.
  # That behavior is a ceiling/limit, not the immediate speed request.
  - platform: template
    id: trane_385_float2
    name: "0x385 Compressor Speed Ceiling Candidate"
    unit_of_measurement: "RPS"
    state_class: measurement
    accuracy_decimals: 1
