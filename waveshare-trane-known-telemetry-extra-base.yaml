  # UX360/zone sensor family ------------------------------------------------
  - platform: template
    id: trane_490_float1
    name: "0x490 Zone 1 Room Temperature"
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 2s
    lambda: |-
      const float value = id(trane_link).get_last_float_le_or_nan(0x490, 0);
      if (!std::isfinite(value) || value <= -90.0f || value > 130.0f) return NAN;
      return value;
    device_id: dev_thermostat

  # Raw byte behind the user-facing Indoor Humidity entity. Normal target
  # operation repeatedly produces plausible RH values in the 50s/60s; node-3
  # startup can temporarily publish 0x9D (157), so keep the unfiltered byte as
  # a disabled diagnostic while the friendly entity rejects values >100.
  - platform: template
    id: trane_490_byte4
    name: "0x490 Zone 1 Humidity Byte Raw"
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 2s
    lambda: 'return id(trane_link).get_last_byte_or_nan(0x490, 4);'
    device_id: dev_thermostat

