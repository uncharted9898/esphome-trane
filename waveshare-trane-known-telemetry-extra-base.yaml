    accuracy_decimals: 0
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 5s
    lambda: 'return id(trane_link).get_unique_standard_ids_seen();'
    device_id: dev_discovery
  - platform: template
    id: trane_json_snapshot_count
    name: "Structured Profile Snapshots Retained"
    accuracy_decimals: 0
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 5s
    lambda: 'return id(trane_link).get_json_snapshot_count();'
    device_id: dev_discovery

  # 5TAMX target telemetry --------------------------------------------------
  # Cross-operating-point correlation against a Technician monitor capture is
  # documented in docs/evidence/2026-09-17/technician-correlation.md.
  - platform: template
    id: trane_200_u16_0
    name: "0x200 Indoor EEV Position Candidate"
    unit_of_measurement: "steps"
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 2s
    lambda: 'return id(trane_link).get_last_u16_le_or_nan(0x200, 0);'
    device_id: dev_air_handler
  # This word leads the 0x318 airflow-family feedback. At high load it is
  # roughly 660 while 0x318.u16@4 is ~651; during moderate modulation it is
  # ~490-570 while feedback trails by roughly 5-15; and on satisfaction it
  # drops immediately to 320 while the feedback remains ~644 before ramping
  # down. That is strong request/target-versus-feedback behavior.
  - platform: template
    id: trane_200_u16_1
    name: "0x200 Blower Airflow Request Candidate"
    unit_of_measurement: "cfm"
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 2s
    lambda: 'return id(trane_link).get_last_u16_le_or_nan(0x200, 2);'
    device_id: dev_air_handler

  # Cross-capture modulation identifies this as the commanded compressor
  # speed: ~29.15 RPS at low load, ~40-43 RPS at moderate load, ~57.5-58 RPS
  # at high load, and it drops ahead of measured speed during satisfaction.
  - platform: template
    id: trane_280_float1
    name: "Compressor Speed Request"
    unit_of_measurement: "RPS"
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 2s
    lambda: 'return id(trane_link).get_last_float_le_or_nan(0x280, 0);'
    device_id: dev_heat_pump
  - platform: template
    id: trane_280_float2
    name: "0x280 Float 2 Candidate"
    state_class: measurement
    accuracy_decimals: 3
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 2s
    lambda: 'return id(trane_link).get_last_float_le_or_nan(0x280, 4);'
    device_id: dev_air_handler

  - platform: template
    id: trane_281_u16_0
    name: "Actual Airflow"
    unit_of_measurement: "cfm"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 2s
    lambda: 'return id(trane_link).get_last_u16_le_or_nan(0x281, 0);'
    device_id: dev_air_handler
  - platform: template
    id: trane_281_u16_1
    name: "0x281 U16 1 Candidate"
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 2s
    lambda: 'return id(trane_link).get_last_u16_le_or_nan(0x281, 2);'
    device_id: dev_air_handler
  - platform: template
    id: trane_281_u16_2
    name: "0x281 U16 2 Raw"
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 2s
    lambda: 'return id(trane_link).get_last_u16_le_or_nan(0x281, 4);'
    device_id: dev_air_handler
  # Bytes 6 and 7 are separate target-observed fields. The LE u16 view at
  # offset 6 is retained only as a raw compatibility surface; it is literally
  # byte6 + (byte7 << 8) and must not be treated as an independent telemetry
  # channel.
  - platform: template
    id: trane_281_u16_3
    name: "0x281 Bytes 6-7 Composite Raw"
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 2s
    lambda: 'return id(trane_link).get_last_u16_le_or_nan(0x281, 6);'
    device_id: dev_air_handler

  # Structured OdStatus.CompDemandPercent matched this byte exactly across
  # four independent update points (72, 82, 84, 82). Keep the raw mirror as a
  # diagnostic compatibility surface; the normal Compressor Demand entity uses
  # this same binary source directly.
  - platform: template
    id: trane_281_byte6
    name: "0x281 Compressor Demand Mirror"
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 2s
    lambda: 'return id(trane_link).get_last_byte_or_nan(0x281, 6);'
    device_id: dev_heat_pump

  # Byte7 remains 1 through the blower coast-down after byte6 reaches zero,
  # then becomes 0 once the indoor blower is stopped.
  - platform: template
    id: trane_281_byte7
    name: "0x281 Blower Active Flag Candidate"
