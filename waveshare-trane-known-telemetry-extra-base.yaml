# Supplemental read-only telemetry declarations for the Home Assistant profile.
#
# These are fields that were already observed/decoded in the upstream capture
# set plus target-system discovery channels backed by the trane_bus observation
# cache. Candidate names deliberately preserve uncertainty until correlations
# satisfy the promotion criteria in docs/TECHNICIAN-3.4.0-MONITOR-SCHEMA.md.
#
# This package intentionally owns no esphome:, canbus:, trane_bus:, or TX
# actions. waveshare-trane-homeassistant.yaml remains the hardware/parser owner.

sensor:
  # SystemOpStatus.D now has repeatable demand-family behavior across idle,
  # moderate and near-full-load captures: 0 at idle, 70 during the 70-percent
  # modulation point, and 96 shortly before the system reaches 99-percent
  # compressor/blower demand. It updates more slowly than OdStatus, so keep
  # Candidate wording rather than treating it as the primary demand channel.
  - platform: template
    id: trane_system_status_d_numeric
    name: "System Demand Percent Candidate"
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    disabled_by_default: true
    device_id: dev_sc360

  # Zones 2-6 setpoints were present in the mature upstream decoder. Keep them
  # disabled by default so single-zone installs stay clean.
  - platform: template
    id: trane_heat_setpoint_z2
    name: "Heat Setpoint Zone 2"
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    disabled_by_default: true
    device_id: dev_thermostat
  - platform: template
    id: trane_cool_setpoint_z2
