button:
  - platform: template
    name: "Dump Structured Profile Snapshots"
    entity_category: diagnostic
    on_press:
      - lambda: 'id(trane_link).dump_json_snapshots();'

  - platform: template
    name: "Dump CAN ID Census"
    entity_category: diagnostic
    on_press:
      - lambda: 'id(trane_link).dump_id_census();'

  - platform: template
    name: "Clear CAN ID Census"
    entity_category: diagnostic
    on_press:
      - lambda: 'id(trane_link).clear_id_census();'

  - platform: template
    name: "Dump CAN Capture Snapshot"
    entity_category: diagnostic
    on_press:
      - lambda: 'id(trane_link).dump_capture();'
