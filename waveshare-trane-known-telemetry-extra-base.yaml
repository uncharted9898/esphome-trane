  - platform: template
    id: trane_300_superheat
    name: "Indoor Superheat"
    unit_of_measurement: "°F"
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 2s
    lambda: |-
      const float gas = id(trane_link).get_last_float_le_or_nan(0x300, 0);
      const float liquid = id(trane_link).get_last_float_le_or_nan(0x300, 4);
      if (!std::isfinite(gas) || !std::isfinite(liquid)) return NAN;
      return gas - liquid;
    device_id: dev_air_handler
  - platform: template
