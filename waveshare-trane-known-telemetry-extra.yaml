  - platform: template
    id: trane_od_temp_user_offset
    name: "Outdoor Temperature User Offset"
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    device_id: dev_sc360

text_sensor:
  - platform: template
    id: trane_system_state
    name: "System State Raw"
    entity_category: diagnostic
    device_id: dev_sc360

  # ActiveAlarms already had two ID/origin slots, but slot 2 lost its level
  # declaration during the package-safe migration.
  - platform: template
    id: trane_alarm_level_2
    name: "Active Alarm 2 Level"
    entity_category: diagnostic
    device_id: dev_sc360

  - platform: template
    id: trane_thermostat_display_name
    name: "Thermostat Display Name"
    entity_category: diagnostic
    device_id: dev_thermostat
  - platform: template
    id: trane_timezone_local_offset
    name: "Local Timezone Offset"
    entity_category: diagnostic
    device_id: dev_thermostat
  - platform: template
    id: trane_timezone_standard_offset
    name: "Standard Timezone Offset"
    entity_category: diagnostic
    device_id: dev_thermostat
  - platform: template
    id: trane_weather_country
    name: "Weather Country Code"
    entity_category: diagnostic
    device_id: dev_thermostat
  - platform: template
    id: trane_weather_region
    name: "Weather Region Code"
    entity_category: diagnostic
    device_id: dev_thermostat

  # Private UX360 <-> SC360 transport is especially valuable during cold boot.
  # Expose the most recent raw CAN frame in addition to the continuous log and
  # bounded capture ring.
  - platform: template
    id: trane_last_5c1_raw
    name: "Last 0x5C1 Raw"
    entity_category: diagnostic
    device_id: dev_discovery
  - platform: template
    id: trane_last_5c9_raw
    name: "Last 0x5C9 Raw"
    entity_category: diagnostic
    device_id: dev_discovery
