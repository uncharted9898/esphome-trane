    name: "Weather Region Code"
    entity_category: diagnostic
    device_id: dev_thermostat

  # Private UX360 <-> SC360 transport is especially valuable during cold boot.
  # Expose the most recent raw CAN frame in addition to the continuous log and
  # bounded capture ring.
  - platform: template
    id: trane_last_5c1_raw
    name: "Last 0x5C1 Raw"
    entity_category: diagnostic
    device_id: dev_discovery
  - platform: template
    id: trane_last_5c9_raw
    name: "Last 0x5C9 Raw"
    entity_category: diagnostic
    device_id: dev_discovery

  # The transport component now remembers structured-message metadata without
  # changing or transmitting anything. This preserves one-shot profile requests
  # such as the target-observed THERMOSETTINGS request.
  - platform: template
    id: trane_last_json_root
    name: "Last Structured JSON Root"
    entity_category: diagnostic
    update_interval: 2s
    lambda: 'return {id(trane_link).get_last_json_root()};'
    device_id: dev_discovery
  - platform: template
    id: trane_last_profile_request
    name: "Last OEM GetProfile Request"
    entity_category: diagnostic
    update_interval: 2s
    lambda: 'return {id(trane_link).get_last_profile_request()};'
    device_id: dev_discovery
  - platform: template
    id: trane_4b1_epoch
    name: "0x4B1 Epoch Seconds"
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      const uint32_t value = id(trane_link).get_last_u32_le_or_zero(0x4B1, 0);
      if (value == 0) return {std::string{}};
      char out[16];
      snprintf(out, sizeof(out), "%lu", static_cast<unsigned long>(value));
      return {std::string(out)};
    device_id: dev_thermostat
  - platform: template
    id: trane_281_raw
    name: "Last 0x281 Raw"
    entity_category: diagnostic
    update_interval: 5s
    lambda: 'return {id(trane_link).get_last_frame_hex(0x281)};'
    device_id: dev_discovery
  - platform: template
    id: trane_385_raw
    name: "Last 0x385 Raw"
    entity_category: diagnostic
    update_interval: 5s
    lambda: 'return {id(trane_link).get_last_frame_hex(0x385)};'
    device_id: dev_discovery
  - platform: template
    id: trane_38c_raw
    name: "Last 0x38C Raw"
    entity_category: diagnostic
    update_interval: 5s
    lambda: 'return {id(trane_link).get_last_frame_hex(0x38C)};'
    device_id: dev_discovery

