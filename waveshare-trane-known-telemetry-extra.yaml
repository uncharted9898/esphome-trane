# Curated supplemental read-only telemetry package for the normal Home
# Assistant profile.
#
# Raw per-CAN-ID text surfaces intentionally do NOT live here. They are loaded
# only by waveshare-trane-homeassistant-debug.yaml so the normal HA device pages
# stay useful while reverse-engineering evidence remains available on demand.
#
# No child package owns CAN hardware or transmit actions.

packages:
  established_extra:
    url: https://github.com/uncharted9898/esphome-trane
    ref: dev
    refresh: always
    files:
      - waveshare-trane-known-telemetry-extra-base.yaml

  target_discovery:
    url: https://github.com/uncharted9898/esphome-trane
    ref: dev
    refresh: always
    files:
      - waveshare-trane-target-discovery.yaml
