# Supplemental read-only telemetry declarations for the Home Assistant profile.
#
# These are fields that were already observed/decoded in the upstream capture
# set plus target-system discovery channels backed by the trane_bus observation
# cache. Candidate names deliberately preserve uncertainty until correlations
# satisfy the promotion criteria in docs/TECHNICIAN-3.4.0-MONITOR-SCHEMA.md.
#
# This package intentionally owns no esphome:, canbus:, trane_bus:, or TX
# actions. waveshare-trane-homeassistant.yaml remains the hardware/parser owner.

sensor:
  # SystemOpStatus.D is numeric upstream but its exact meaning is ambiguous
  # (runtime-like versus demand-like). Preserve the numeric value without
  # promoting it to a misleading percent label.
  - platform: template
    id: trane_system_status_d_numeric
    name: "SystemOpStatus D Numeric Candidate"
    state_class: measurement
    accuracy_decimals: 2
    entity_category: diagnostic
    device_id: dev_sc360

  # Zones 2-6 setpoints were present in the mature upstream decoder. Keep them
  # disabled by default so single-zone installs stay clean.
  - platform: template
