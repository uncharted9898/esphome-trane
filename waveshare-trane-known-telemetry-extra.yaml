    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    disabled_by_default: true
    device_id: dev_thermostat
  - platform: template
    id: trane_cool_setpoint_z3
    name: "Cool Setpoint Zone 3"
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    disabled_by_default: true
    device_id: dev_thermostat
  - platform: template
    id: trane_heat_setpoint_z4
    name: "Heat Setpoint Zone 4"
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    disabled_by_default: true
    device_id: dev_thermostat
  - platform: template
    id: trane_cool_setpoint_z4
    name: "Cool Setpoint Zone 4"
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    disabled_by_default: true
    device_id: dev_thermostat
  - platform: template
    id: trane_heat_setpoint_z5
    name: "Heat Setpoint Zone 5"
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    disabled_by_default: true
    device_id: dev_thermostat
  - platform: template
    id: trane_cool_setpoint_z5
    name: "Cool Setpoint Zone 5"
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    disabled_by_default: true
    device_id: dev_thermostat
  - platform: template
    id: trane_heat_setpoint_z6
    name: "Heat Setpoint Zone 6"
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    disabled_by_default: true
    device_id: dev_thermostat
  - platform: template
