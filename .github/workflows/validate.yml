name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

# Treat a dev push and its PR validation as the same work. New commits supersede
# both event types so only the newest branch head consumes runners.
concurrency:
  group: validate-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  contract-tests:
    name: Safety contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m py_compile components/trane_hvac/*.py components/trane_bus/*.py tests/*.py

  commissioning-watch-build:
    name: Waveshare commissioning watcher firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create CI secrets
        run: |
          cat > secrets.yaml << 'EOF'
          wifi_ssid: "configure-me"
          wifi_password: "configure-me"
          EOF
      - name: Compile commissioning watcher
        uses: esphome/build-action@v6
        with:
          yaml-file: waveshare-trane-commissioning.yaml
          substitutions: "version=ci-${{ github.sha }}"

  homeassistant-build:
    name: Home Assistant Waveshare firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create CI secrets
        run: |
          cat > secrets.yaml << 'EOF'
          wifi_ssid: "configure-me"
          wifi_password: "configure-me"
          EOF
      - name: Compile Home Assistant entrypoint
        uses: esphome/build-action@v6
        with:
          yaml-file: waveshare-trane-homeassistant.yaml
          substitutions: "version=ci-${{ github.sha }}"

  homeassistant-debug-build:
    name: Home Assistant debug firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create CI secrets
        run: |
          cat > secrets.yaml << 'EOF'
          wifi_ssid: "configure-me"
          wifi_password: "configure-me"
          EOF
      - name: Compile Home Assistant debug entrypoint
        uses: esphome/build-action@v6
        with:
          yaml-file: waveshare-trane-homeassistant-debug.yaml
          substitutions: "version=ci-${{ github.sha }}"
  # Keep the hardware LISTENONLY image as a diagnostic fallback, but it is no
  # longer the preferred commissioning image because it changes CAN ACK behavior.
  passive-recorder-build:
    name: Waveshare passive recorder firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create CI secrets
        run: |
          cat > secrets.yaml << 'EOF'
          wifi_ssid: "configure-me"
          wifi_password: "configure-me"
          EOF
      - name: Compile passive recorder
        uses: esphome/build-action@v6
        with:
          yaml-file: waveshare-trane-listenonly.yaml
          substitutions: "version=ci-${{ github.sha }}"

  esphome-build:
    name: ESPHome firmware profiles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create CI secrets
        run: |
          cat > secrets.yaml << 'EOF'
          wifi_ssid: "configure-me"
          wifi_password: "configure-me"
          EOF
          cp secrets.yaml tests/secrets.yaml

      - name: Compile legacy full decoder
        uses: esphome/build-action@v6
        with:
          yaml-file: esphome-trane.yaml
          substitutions: "version=ci-${{ github.sha }}"

      - name: Compile guarded transport smoke profile
        uses: esphome/build-action@v6
        with:
          yaml-file: tests/trane-bus-smoke.yaml
          substitutions: "version=ci-${{ github.sha }}"

      - name: Compile Waveshare guarded control profile
        uses: esphome/build-action@v6
        with:
          yaml-file: waveshare-trane-control.yaml
          substitutions: "version=ci-${{ github.sha }}"

      - name: Compile Waveshare full decoder profile
        uses: esphome/build-action@v6
        with:
          yaml-file: waveshare-trane-full.yaml
          substitutions: "version=ci-${{ github.sha }}"
