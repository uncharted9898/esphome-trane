name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - 'feature/**'

permissions:
  contents: read

jobs:
  contract-tests:
    name: Safety contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m py_compile components/trane_hvac/*.py components/trane_bus/*.py tests/*.py

  esphome-build:
    name: ESPHome compile (${{ matrix.config }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - esphome-trane.yaml
          - tests/trane-bus-smoke.yaml
          - waveshare-trane-listenonly.yaml
          - waveshare-trane-control.yaml
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create CI secrets
        run: |
          cat > secrets.yaml << 'EOF'
          wifi_ssid: "configure-me"
          wifi_password: "configure-me"
          EOF
      - name: Mirror secrets for test configs
        run: cp secrets.yaml tests/secrets.yaml
      - name: Compile firmware
        uses: esphome/build-action@v6
        with:
          yaml-file: ${{ matrix.config }}
          substitutions: "version=ci-${{ github.sha }}"
