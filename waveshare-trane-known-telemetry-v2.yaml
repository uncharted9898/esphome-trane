  - platform: template
    id: trane_unknown_frames
    name: "Unclassified CAN Frames"
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 5s
    lambda: 'return id(trane_unknown_frame_count);'
    device_id: dev_discovery

