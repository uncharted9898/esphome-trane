# Read-only entity declarations and JSON parser support for the Waveshare
# Trane Link bridge. Hardware ownership stays in waveshare-trane-homeassistant.yaml.
#
# Confidence policy:
# - normal names: observed/strong semantic mapping
# - Candidate/Raw names: useful discovery channels, not yet promoted to truth
# - expected-but-unmapped 5TAMX/5TWV0X/A2L fields remain raw/discovery only
#
# This package intentionally contains no esphome:, canbus:, trane_bus:, or
# transmit actions. The parent device owns those boundaries.

globals:
  - id: trane_unknown_frame_count
    type: uint32_t
    restore_value: no
    initial_value: "0"

sensor:
  - platform: template
    id: trane_room_temp
    name: "Room Temperature"
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 2s
    lambda: |-
      const float value = id(trane_link).get_last_float_le_or_nan(0x490, 0);
      if (!std::isfinite(value) || value <= -90.0f || value > 130.0f) return NAN;
      return value;
    device_id: dev_thermostat
  - platform: template
    id: trane_heat_setpoint
    name: "Heat Setpoint"
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    device_id: dev_thermostat
  - platform: template
    id: trane_cool_setpoint
    name: "Cool Setpoint"
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    device_id: dev_thermostat
  - platform: template
    id: trane_indoor_humidity
    name: "Indoor Humidity"
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 2s
    lambda: |-
      const float value = id(trane_link).get_last_byte_or_nan(0x490, 4);
      if (!std::isfinite(value) || value < 0.0f || value > 100.0f) return NAN;
      return value;
    device_id: dev_thermostat
  - platform: template
    id: trane_zone1_airflow
    name: "Zone 1 Airflow"
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    device_id: dev_thermostat
  - platform: template
    id: trane_zone1_demand
    name: "Zone 1 Demand"
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    device_id: dev_thermostat

  - platform: template
    # Legacy internal id retained for entity/API compatibility. SystemOpStatus.E
    # does not track outdoor ambient temperature: it stayed near 57-58 while
    # the binary outdoor sensor moved from the upper-70s into the mid-80s F.
    # Instead E behaves like the full-scale compressor-speed ceiling used by
    # OdStatus.B: 58 RPS * 99% ~= 57.42 RPS, matching 0x280 ~=57.45 RPS.
    id: trane_sc360_outdoor_temp
    name: "System Compressor Speed Ceiling Candidate"
    unit_of_measurement: "RPS"
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    disabled_by_default: true
    device_id: dev_sc360
  - platform: template
    id: trane_od_widget_temp
    name: "Outdoor Widget Temperature"
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    device_id: dev_sc360

  - platform: template
    id: trane_blower_speed
    name: "Indoor Blower Speed"
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    device_id: dev_air_handler
  - platform: template
    id: trane_283_float1
    name: "0x283 Indoor Temperature 1 Candidate"
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    entity_category: diagnostic
    disabled_by_default: true
    device_id: dev_air_handler
  - platform: template
    id: trane_283_float2
    name: "0x283 Indoor Temperature 2 Candidate"
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    entity_category: diagnostic
    disabled_by_default: true
    device_id: dev_air_handler
  - platform: template
    id: trane_308_float1
    name: "Return Air Temperature"
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    device_id: dev_air_handler
  - platform: template
    id: trane_308_float2
    name: "Supply Air Temperature"
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    device_id: dev_air_handler

  - platform: template
    id: trane_compressor_speed
    name: "Compressor Speed"
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    device_id: dev_heat_pump
  - platform: template
    id: trane_compressor_demand
    name: "Compressor Demand"
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    device_id: dev_heat_pump
  - platform: template
    id: trane_outdoor_air_temp
    name: "Outdoor Air Temperature"
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    device_id: dev_heat_pump
  - platform: template
    id: trane_suction_temp
    # Loaded cooling capture tracked this channel with the outdoor coil rather
    # than the evaporator/suction line. Keep the legacy id for package/API
    # compatibility while exposing the requalified semantic as a candidate.
    name: "0x381 Outdoor Coil Temperature Candidate"
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    entity_category: diagnostic
    disabled_by_default: true
    device_id: dev_heat_pump
  - platform: template
    id: trane_discharge_temp
    name: "0x383 Compressor Dome Discharge Temperature Candidate"
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    entity_category: diagnostic
    disabled_by_default: true
    device_id: dev_heat_pump
  - platform: template
    id: trane_380_float1
    name: "0x380 Float 1 Raw"
    accuracy_decimals: 3
    entity_category: diagnostic
    disabled_by_default: true
    device_id: dev_heat_pump
  - platform: template
    id: trane_386_float1
    name: "0x386 Float 1 Raw"
    state_class: measurement
    accuracy_decimals: 2
    entity_category: diagnostic
    disabled_by_default: true
    device_id: dev_heat_pump
  - platform: template
    id: trane_386_float2
    name: "0x386 Float 2 Raw"
    state_class: measurement
    accuracy_decimals: 2
    entity_category: diagnostic
    disabled_by_default: true
    device_id: dev_heat_pump
  - platform: template
    id: trane_387_float1
    # 2026-09-17 idle/profile-sweep held this field at exactly 55.0 while the
    # compressor was stopped. 2026-09-18 active modulation then held it at the
    # same 55.0 while actual compressor speed moved through roughly 36-42 RPS
    # and structured OdStatus.B moved through 70-73%. It is not actual speed;
    # the stable non-zero value is now best classified as a speed reference or
    # limit family field. Keep Candidate wording until the OEM service surface
    # identifies which limit/reference it represents.
    name: "0x387 Compressor Speed Reference Limit Candidate"
    unit_of_measurement: "RPS"
    state_class: measurement
    accuracy_decimals: 2
    entity_category: diagnostic
    disabled_by_default: true
    device_id: dev_heat_pump
  - platform: template
    id: trane_38f_pressure
    name: "0x38F Line Voltage Candidate"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    disabled_by_default: true
    device_id: dev_heat_pump

  - platform: template
    id: trane_410_temp
    name: "0x410 Drive Temperature 1 Candidate"
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
