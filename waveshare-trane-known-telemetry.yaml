      - can_id: 0x283
        can_id_mask: 0x7FF
        then:
          - lambda: |-
              if (x.size() < 8) return; float a, b; memcpy(&a, &x[0], 4); memcpy(&b, &x[4], 4);
              if (isfinite(a) && a > -100 && a < 300) id(trane_283_float1).publish_state(a);
              if (isfinite(b) && b > -100 && b < 300) id(trane_283_float2).publish_state(b);

      - can_id: 0x308
        can_id_mask: 0x7FF
        then:
          - lambda: |-
              if (x.size() < 8) return; float a, b; memcpy(&a, &x[0], 4); memcpy(&b, &x[4], 4);
              if (isfinite(a) && a > -100 && a < 250) id(trane_308_float1).publish_state(a);
              if (isfinite(b) && b > -100 && b < 250) id(trane_308_float2).publish_state(b);

      - can_id: 0x410
        can_id_mask: 0x7FF
        then:
          - lambda: |-
              if (x.size() < 4) return; float v; memcpy(&v, &x[0], 4);
              if (isfinite(v) && v > -100 && v < 300) id(trane_410_temp).publish_state(v);

      - can_id: 0x430
        can_id_mask: 0x7FF
        then:
          - lambda: |-
              if (x.size() < 4) return; float v; memcpy(&v, &x[0], 4);
              if (isfinite(v) && v > -100 && v < 300) id(trane_430_temp).publish_state(v);

