# Reusable read-only telemetry package for the Waveshare Trane Link bridge.
#
# This package intentionally exposes three confidence classes:
#   1. Known/observed semantic entities (normal names).
#   2. Candidate/raw channels (names explicitly say Candidate/Raw).
#   3. Discovery surfaces for currently unknown target-system traffic.
#
# Nothing in this file transmits CAN frames or enables Trane application TX.
# It is designed to be useful in ESPHome's web_server/API before the target
# 5TAMX/5TWV0X/A2L capture has finished qualifying every new-generation field.

esphome:
  devices:
    - id: dev_thermostat
      name: "Trane UX360"
    - id: dev_sc360
      name: "Trane SC360"
    - id: dev_air_handler
      name: "Trane 5TAMX Air Handler"
    - id: dev_heat_pump
      name: "Trane 5TWV0X Heat Pump"
    - id: dev_discovery
      name: "Trane Link Discovery"

# Count traffic that does not yet belong to the protocol inventory. This is a
# diagnostic counter, not an attempt to assign semantics to unknown IDs.
globals:
  - id: trane_unknown_frame_count
    type: uint32_t
    restore_value: no
    initial_value: "0"

