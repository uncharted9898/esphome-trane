# Parse already-reassembled 0x641/0x649 JSON from the guarded trane_bus.
trane_bus:
  id: trane_link
  on_json:
    - lambda: |-
        const std::string &j = json;
        ESP_LOGI("trane_json", "TRANE_JSON,%03lX,%s",
                 static_cast<unsigned long>(can_id), j.c_str());
        if (can_id == 0x649) id(trane_last_json_649).publish_state(j);
        if (can_id == 0x641) id(trane_last_json_641).publish_state(j);

        auto object_range = [&](const std::string &key, size_t from, size_t limit,
                                size_t &start, size_t &end) -> bool {
          std::string needle = "\"" + key + "\"";
          size_t kp = j.find(needle, from);
          if (kp == std::string::npos || kp >= limit) return false;
          size_t brace = j.find('{', kp + needle.size());
          if (brace == std::string::npos || brace >= limit) return false;
          int depth = 0;
          bool in_string = false;
          bool escaped = false;
          for (size_t p = brace; p < limit; p++) {
            char c = j[p];
            if (in_string) {
              if (escaped) { escaped = false; continue; }
              if (c == '\\') { escaped = true; continue; }
              if (c == '"') in_string = false;
              continue;
            }
            if (c == '"') { in_string = true; continue; }
            if (c == '{') depth++;
            else if (c == '}') {
              depth--;
              if (depth == 0) { start = brace + 1; end = p; return true; }
            }
          }
          return false;
        };

        auto get_string = [&](size_t start, size_t end, const std::string &key,
                              std::string &out) -> bool {
          std::string needle = "\"" + key + "\":\"";
          size_t p = j.find(needle, start);
          if (p == std::string::npos || p >= end) return false;
          p += needle.size();
          size_t e = j.find('"', p);
          if (e == std::string::npos || e > end) return false;
          out = j.substr(p, e - p);
          return true;
        };

        auto get_float = [&](size_t start, size_t end, const std::string &key,
                             float &out) -> bool {
          std::string s;
          if (!get_string(start, end, key, s) || s.empty()) return false;
          char *tail = nullptr;
          out = strtof(s.c_str(), &tail);
          return tail != s.c_str() && *tail == '\0';
        };

        auto publish_preset = [&](size_t ps, size_t pe, const char *name,
                                  sensor::Sensor *heat, sensor::Sensor *cool) {
          size_t s, e;
          if (!object_range(name, ps, pe, s, e)) return;
          float v;
          if (get_float(s, e, "Hsp", v)) heat->publish_state(v);
          if (get_float(s, e, "Csp", v)) cool->publish_state(v);
        };

        size_t s, e;
        std::string value;
        float f;

        if (object_range("SystemOpStatus", 0, j.size(), s, e)) {
          if (get_string(s, e, "B", value)) {
            if (value == "A") id(trane_system_mode).publish_state("heat");
            else if (value == "B") id(trane_system_mode).publish_state("cool");
            else if (value == "C") id(trane_system_mode).publish_state("off");
            else id(trane_system_mode).publish_state(value);
          }
          if (get_string(s, e, "C", value)) id(trane_system_demand_stage).publish_state(value);
          if (get_string(s, e, "D", value)) id(trane_system_status_d_raw).publish_state(value);
          if (get_string(s, e, "E", value)) {
            id(trane_system_status_e_raw).publish_state(value);
            char *tail = nullptr;
            float v = strtof(value.c_str(), &tail);
            if (tail != value.c_str() && *tail == '\0') {
              // Historical SC360 captures use decimal-form E for outdoor temp
              // and integer-form E for indoor humidity. Keep E Raw visible so
              // the target 9.4.x system can prove/refute this heuristic.
              if (value.find('.') != std::string::npos) {
                if (v > -60 && v < 160) id(trane_sc360_outdoor_temp).publish_state(v);
              } else if (v >= 0 && v <= 100) {
                id(trane_indoor_humidity).publish_state(v);
              }
            }
          }
        }

        if (object_range("ZoneStatus", 0, j.size(), s, e)) {
          size_t zs, ze;
          if (object_range("1", s, e, zs, ze)) {
            if (get_float(zs, ze, "H", f) && f > 20 && f < 120) id(trane_room_temp).publish_state(f);
            if (get_float(zs, ze, "Hsp", f)) id(trane_heat_setpoint).publish_state(f);
            if (get_float(zs, ze, "Csp", f)) id(trane_cool_setpoint).publish_state(f);
            if (get_float(zs, ze, "E", f) && f >= 0 && f <= 100) id(trane_zone1_airflow).publish_state(f);
            if (get_float(zs, ze, "G", f)) id(trane_zone1_demand).publish_state(f);
            if (get_string(zs, ze, "F", value)) id(trane_zone1_state).publish_state(value);
            if (get_string(zs, ze, "HcStatus", value)) id(trane_zone1_hc_status).publish_state(value);
            if (get_string(zs, ze, "HoldText", value)) id(trane_zone1_hold_text).publish_state(value);
          }
        }

        if (object_range("SpOverride", 0, j.size(), s, e)) {
          size_t zs, ze;
          if (object_range("1", s, e, zs, ze)) {
            if (get_float(zs, ze, "Hsp", f)) id(trane_heat_setpoint).publish_state(f);
            if (get_float(zs, ze, "Csp", f)) id(trane_cool_setpoint).publish_state(f);
            if (get_string(zs, ze, "Source", value)) id(trane_setpoint_source).publish_state(value);
            if (get_string(zs, ze, "HoldType", value)) id(trane_hold_type).publish_state(value);
          }
        }

        if (object_range("OdStatus", 0, j.size(), s, e)) {
          size_t os, oe;
          if (object_range("1", s, e, os, oe)) {
            if (get_string(os, oe, "A", value)) id(trane_outdoor_active).publish_state(value);
            if (get_float(os, oe, "B", f) && f >= 0 && f <= 100) id(trane_compressor_speed).publish_state(f);
            if (get_string(os, oe, "C", value)) id(trane_outdoor_state).publish_state(value);
            if (get_string(os, oe, "D", value)) id(trane_outdoor_fault).publish_state(value);
            if (get_float(os, oe, "CompDemandPercent", f)) id(trane_compressor_demand).publish_state(f);
          }
          if (get_float(s, e, "CompDemandPercent", f)) id(trane_compressor_demand).publish_state(f);
        }

        if (object_range("IndoorStatus", 0, j.size(), s, e)) {
          size_t is, ie;
          if (!object_range("1", s, e, is, ie)) { is = s; ie = e; }
          if (get_string(is, ie, "D", value)) id(trane_indoor_state).publish_state(value);
          if (get_string(is, ie, "E", value)) {
            id(trane_indoor_status_e_raw).publish_state(value);
            char *tail = nullptr;
            float v = strtof(value.c_str(), &tail);
            if (tail != value.c_str() && *tail == '\0' && v >= 0 && v <= 100)
              id(trane_blower_speed).publish_state(v);
            else if (!value.empty())
              id(trane_indoor_fault).publish_state(value);
          }
          if (get_string(is, ie, "F", value)) id(trane_indoor_status_f_raw).publish_state(value);
          if (get_string(is, ie, "HumControl", value)) id(trane_hum_control).publish_state(value);
          if (get_string(is, ie, "HumidifierStatus", value)) id(trane_humidifier_status).publish_state(value);
          if (get_string(is, ie, "DehumidifierStatus", value)) id(trane_dehumidifier_status).publish_state(value);
          if (get_string(is, ie, "VentilatorStatus", value)) id(trane_ventilator_status).publish_state(value);
        }

        if (object_range("VersionDetails", 0, j.size(), s, e)) {
          if (get_string(s, e, "ConfigPropertiesVersion", value)) id(trane_config_version).publish_state(value);
          if (get_string(s, e, "AlarmDetailsVersion", value)) id(trane_alarm_db_version).publish_state(value);
        }

        if (object_range("UnitID", 0, j.size(), s, e)) {
          if (get_string(s, e, "ModelNumber", value)) id(trane_unit_model).publish_state(value);
          if (get_string(s, e, "SerialNumber", value)) id(trane_unit_serial).publish_state(value);
          if (get_string(s, e, "BuildInfo", value)) id(trane_unit_firmware).publish_state(value);
        }

        if (object_range("OdWidget", 0, j.size(), s, e)) {
          if (get_float(s, e, "A", f) && f > -60 && f < 160) id(trane_od_widget_temp).publish_state(f);
        }

        if (object_range("ScheduleSettings", 0, j.size(), s, e)) {
          if (get_string(s, e, "WeeklySchEnable", value)) id(trane_schedule_enabled).publish_state(value);
        }

        if (object_range("PresetSettings", 0, j.size(), s, e)) {
          publish_preset(s, e, "Home", id(trane_preset_home_heat), id(trane_preset_home_cool));
          publish_preset(s, e, "Away", id(trane_preset_away_heat), id(trane_preset_away_cool));
          publish_preset(s, e, "Sleep", id(trane_preset_sleep_heat), id(trane_preset_sleep_cool));
        }

        if (object_range("ZoneCardState", 0, j.size(), s, e)) {
          text_sensor::TextSensor *names[6] = {
            id(trane_zone_name_1), id(trane_zone_name_2), id(trane_zone_name_3),
            id(trane_zone_name_4), id(trane_zone_name_5), id(trane_zone_name_6)
          };
          for (int z = 1; z <= 6; z++) {
            size_t zs, ze;
            if (object_range(std::to_string(z), s, e, zs, ze) && get_string(zs, ze, "B", value))
              names[z - 1]->publish_state(value);
          }
        }

        if (object_range("WeatherData", 0, j.size(), s, e)) {
          if (get_string(s, e, "A", value)) id(trane_weather_zip).publish_state(value);
          if (get_string(s, e, "D", value)) id(trane_weather_status).publish_state(value);
        }

        if (object_range("WeatherToday", 0, j.size(), s, e)) {
          if (get_string(s, e, "C", value)) id(trane_weather_city).publish_state(value);
          if (get_float(s, e, "D", f)) id(trane_weather_current_temp).publish_state(f);
          if (get_float(s, e, "E", f)) id(trane_weather_humidity).publish_state(f);
          if (get_float(s, e, "F", f)) id(trane_weather_feels_like).publish_state(f);
          if (get_float(s, e, "G", f)) id(trane_weather_high).publish_state(f);
          if (get_string(s, e, "H", value)) id(trane_weather_condition).publish_state(value);
          if (get_float(s, e, "I", f)) id(trane_weather_low).publish_state(f);
        }

        if (object_range("ActiveAlarms", 0, j.size(), s, e)) {
          if (j.find("\"Deleted\"", s) != std::string::npos && j.find("\"Deleted\"", s) < e) {
            id(trane_alarm_id_1).publish_state("cleared");
            id(trane_alarm_origin_1).publish_state("");
            id(trane_alarm_level_1).publish_state("");
            id(trane_alarm_id_2).publish_state("");
            id(trane_alarm_origin_2).publish_state("");
          } else {
            auto find_alarm_field = [&](const std::string &key, size_t from, std::string &out, size_t &after) -> bool {
              std::string needle = "\"" + key + "\":\"";
              size_t p = j.find(needle, from);
              if (p == std::string::npos || p >= e) return false;
              p += needle.size();
              size_t q = j.find('"', p);
              if (q == std::string::npos || q > e) return false;
              out = j.substr(p, q - p);
              after = q + 1;
              return true;
            };
            size_t next = s;
            if (find_alarm_field("AlarmId", next, value, next)) id(trane_alarm_id_1).publish_state(value);
            size_t second_from = next;
            if (find_alarm_field("AlarmId", second_from, value, next)) id(trane_alarm_id_2).publish_state(value);
            next = s;
            if (find_alarm_field("Origin", next, value, next)) id(trane_alarm_origin_1).publish_state(value);
            second_from = next;
            if (find_alarm_field("Origin", second_from, value, next)) id(trane_alarm_origin_2).publish_state(value);
            next = s;
            if (find_alarm_field("Level", next, value, next)) id(trane_alarm_level_1).publish_state(value);
          }
        }

# Raw frame channels and discovery catchall. These callbacks only read/publish.
canbus:
  - id: !extend hvac_can
    on_frame:
      - can_id: 0x380
        can_id_mask: 0x7FF
        then:
          - lambda: |-
              if (x.size() < 8) return;
              float a, b; memcpy(&a, &x[0], 4); memcpy(&b, &x[4], 4);
              if (isfinite(a)) id(trane_380_float1).publish_state(a);
              if (isfinite(b) && b > -80 && b < 180) id(trane_outdoor_air_temp).publish_state(b);

      - can_id: 0x381
        can_id_mask: 0x7FF
        then:
          - lambda: |-
              if (x.size() < 4) return; float v; memcpy(&v, &x[0], 4);
              if (isfinite(v) && v > -100 && v < 300) id(trane_suction_temp).publish_state(v);

      - can_id: 0x383
        can_id_mask: 0x7FF
        then:
          - lambda: |-
              if (x.size() < 4) return; float v; memcpy(&v, &x[0], 4);
              if (isfinite(v) && v > -100 && v < 400) id(trane_discharge_temp).publish_state(v);

      - can_id: 0x386
        can_id_mask: 0x7FF
        then:
          - lambda: |-
              if (x.size() < 8) return; float a, b; memcpy(&a, &x[0], 4); memcpy(&b, &x[4], 4);
              if (isfinite(a) && a > -100 && a < 300) id(trane_386_float1).publish_state(a);
              if (isfinite(b) && b > -100 && b < 300) id(trane_386_float2).publish_state(b);

      - can_id: 0x387
        can_id_mask: 0x7FF
        then:
          - lambda: |-
              if (x.size() < 4) return; float v; memcpy(&v, &x[0], 4);
