              if (isfinite(v) && v > -100 && v < 300) id(trane_450_temp).publish_state(v);

      - can_id: 0x490
        can_id_mask: 0x7FF
        then:
          - lambda: |-
              char buf[32] = {0}; size_t pos = 0;
              for (size_t i = 0; i < x.size() && i < 8 && pos + 3 < sizeof(buf); i++)
                pos += snprintf(buf + pos, sizeof(buf) - pos, "%02X%s", x[i], i + 1 < x.size() ? " " : "");
              id(trane_490_raw).publish_state(buf);

      - can_id: 0x000
        can_id_mask: 0x000
        use_extended_id: false
        then:
          - lambda: |-
              switch (can_id) {
                case 0x641: case 0x649: case 0x5C1: case 0x5C9:
                case 0x283: case 0x308: case 0x380: case 0x381:
                case 0x382: case 0x383: case 0x384: case 0x385:
                case 0x386: case 0x387: case 0x388: case 0x389:
                case 0x38A: case 0x38B: case 0x38C: case 0x38D:
                case 0x38E: case 0x38F: case 0x410: case 0x430:
                case 0x450: case 0x490:
                  return;
              }
              id(trane_unknown_frame_count)++;
              char idbuf[12]; snprintf(idbuf, sizeof(idbuf), "0x%03lX", static_cast<unsigned long>(can_id));
              id(trane_last_unknown_id).publish_state(idbuf);
              char frame[48] = {0}; size_t pos = snprintf(frame, sizeof(frame), "%s ", idbuf);
              for (size_t i = 0; i < x.size() && i < 8 && pos + 3 < sizeof(frame); i++)
                pos += snprintf(frame + pos, sizeof(frame) - pos, "%02X%s", x[i], i + 1 < x.size() ? " " : "");
              id(trane_last_unknown_frame).publish_state(frame);
