# Raw target-system diagnostics for unresolved but repeatedly observed Link IDs.
#
# Everything here is disabled by default. These surfaces exist so a field can
# be correlated over time without promoting speculative HVAC semantics. This
# package is observation-only and owns no CAN hardware or TX actions.

text_sensor:
  # Indoor / low-ID application family -------------------------------------
  - platform: template
    name: "Last 0x201 Raw"
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 5s
    lambda: 'return {id(trane_link).get_last_frame_hex(0x201)};'
    device_id: dev_discovery
