substitutions:
  version: "dev-listenonly"

esphome:
  name: trane-link-listenonly
  friendly_name: Trane Link Passive Capture
  project:
    name: "uncharted9898.trane-link-bridge"
    version: ${version}

external_components:
  - source:
      type: local
      path: components
    components: [trane_bus]

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: DEBUG
  logs:
    canbus: WARN
    trane_bus: INFO

api:

ota:
  - platform: esphome

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  ap:
    ssid: "Trane Link Capture Setup"

captive_portal:
improv_serial:

canbus:
  - platform: esp32_can
    id: hvac_can
    tx_pin: GPIO15
    rx_pin: GPIO16
    bit_rate: 50kbps
    can_id: 1
    mode: LISTENONLY
    tx_queue_len: 0
    rx_queue_len: 128

trane_bus:
  id: trane_link
  canbus_id: hvac_can
  command_can_id: 0x641
  tx_enabled: false
  raw_json_enabled: false
  require_sc360_before_tx: true
  capture_capacity: 8192
  capture_enabled: true

text_sensor:
  - platform: template
    name: "Commissioning Mode"
    lambda: |-
      return {"PASSIVE LISTEN-ONLY"};
    update_interval: 60s

binary_sensor:
  - platform: template
    name: "SC360 Traffic Seen"
    lambda: |-
      return id(trane_link).has_seen_sc360();

  - platform: template
    name: "CAN Capture Running"
    lambda: |-
      return id(trane_link).is_capture_enabled();

sensor:
  # Total standard/extended/RTR callbacks observed by trane_bus. During
  # commissioning this is intentionally broader than the known-Trane counter so
  # new 5TAMX/5TWV0X/A2L node traffic is visible instead of disappearing into
  # the old protocol map.
  - platform: template
    name: "Total CAN Frames Seen"
    accuracy_decimals: 0
    lambda: |-
      return id(trane_link).get_rx_frames();
    update_interval: 10s

  - platform: template
    name: "Known Trane Frames Seen"
    accuracy_decimals: 0
    lambda: |-
      return id(trane_link).get_trane_frames();
    update_interval: 10s

  # Discovery hint only: a non-zero value means traffic exists outside the IDs
  # currently classified by is_known_trane_id_(). The raw capture remains the
  # authoritative source because this counter does not identify which IDs are new.
  - platform: template
    name: "Unclassified CAN Frames Seen"
    accuracy_decimals: 0
    lambda: |-
      const uint32_t total = id(trane_link).get_rx_frames();
      const uint32_t known = id(trane_link).get_trane_frames();
      return total >= known ? total - known : 0;
    update_interval: 10s

  - platform: template
    name: "SC360 Frames Seen"
    accuracy_decimals: 0
    lambda: |-
      return id(trane_link).get_sc360_frames();
    update_interval: 10s

  - platform: template
    name: "Segmented JSON Messages"
    accuracy_decimals: 0
    lambda: |-
      return id(trane_link).get_rx_json_messages();
    update_interval: 10s

  - platform: template
    name: "RX Transport Errors"
    accuracy_decimals: 0
    lambda: |-
      return id(trane_link).get_rx_transport_errors();
    update_interval: 10s

  - platform: template
    name: "Captured CAN Frames"
    accuracy_decimals: 0
    lambda: |-
      return id(trane_link).get_capture_size();
    update_interval: 5s

  - platform: template
    name: "Capture Ring Overwrites"
    accuracy_decimals: 0
    lambda: |-
      return id(trane_link).get_capture_overwrites();
    update_interval: 5s

button:
  - platform: template
    name: "Freeze CAN Capture"
    icon: mdi:snowflake
    on_press:
      - lambda: |-
          id(trane_link).stop_capture();
          ESP_LOGI("trane_capture", "Capture frozen with %u frames", (unsigned) id(trane_link).get_capture_size());

  - platform: template
    name: "Dump Frozen CAN Capture"
    icon: mdi:download
    on_press:
      - lambda: |-
          id(trane_link).stop_capture();
          id(trane_link).dump_capture();

  - platform: template
    name: "Clear And Resume CAN Capture"
    icon: mdi:record-rec
    on_press:
      - lambda: |-
          id(trane_link).start_capture(true);
