substitutions:
  version: "dev-listenonly"

esphome:
  name: trane-link-listenonly
  friendly_name: Trane Link Passive Capture
  project:
    name: "uncharted9898.trane-link-bridge"
    version: ${version}

external_components:
  - source:
      type: local
      path: components
    components: [trane_bus]

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: DEBUG
  logs:
    canbus: INFO
    trane_bus: DEBUG

api:

ota:
  - platform: esphome

wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  ap:
    ssid: "Trane Link Capture Setup"

captive_portal:
improv_serial:

canbus:
  - platform: esp32_can
    id: hvac_can
    tx_pin: GPIO15
    rx_pin: GPIO16
    bit_rate: 50kbps
    can_id: 1
    mode: LISTENONLY
    tx_queue_len: 0
    rx_queue_len: 64
    on_frame:
      - can_id: 0x000
        can_id_mask: 0x000
        then:
          - lambda: |-
              static uint32_t frame_count = 0;
              frame_count++;
              if (frame_count <= 50 || (frame_count % 250) == 0) {
                char buf[96];
                int pos = snprintf(buf, sizeof(buf), "ID:%03X DLC:%u ", can_id, (unsigned)x.size());
                for (size_t i = 0; i < x.size() && pos < 84; i++)
                  pos += snprintf(buf + pos, sizeof(buf) - pos, "%02X ", x[i]);
                ESP_LOGI("trane_capture", "%s", buf);
              }

trane_bus:
  id: trane_link
  canbus_id: hvac_can
  command_can_id: 0x641
  tx_enabled: false
  raw_json_enabled: false
  require_sc360_before_tx: true

text_sensor:
  - platform: template
    name: "Commissioning Mode"
    lambda: |-
      return {"PASSIVE LISTEN-ONLY"};
    update_interval: 60s

binary_sensor:
  - platform: template
    name: "SC360 Traffic Seen"
    lambda: |-
      return id(trane_link).has_seen_sc360();

sensor:
  - platform: template
    name: "Trane Frames Seen"
    accuracy_decimals: 0
    lambda: |-
      return id(trane_link).get_trane_frames();
    update_interval: 10s

  - platform: template
    name: "SC360 Frames Seen"
    accuracy_decimals: 0
    lambda: |-
      return id(trane_link).get_sc360_frames();
    update_interval: 10s
